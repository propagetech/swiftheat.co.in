name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update sitemap lastmod for deploy
        run: |
          if [ -f sitemap.xml ]; then
            ISODATE=$(date +%Y-%m-%d)
            sed -i "s/<lastmod>.*<\/lastmod>/<lastmod>${ISODATE}<\/lastmod>/g" sitemap.xml
          fi

      - name: Strip internal files from the deploy
        run: |
          rm -rf docs .claude tools drafts
          # The archive of the old WordPress site stays in the repository as the
          # record of what was there, but it must not be served. Two reasons.
          # Cartridge-Heaters-2.png carries a competitor's DETAI watermark, and
          # re-hosting another manufacturer's photograph on a public URL we
          # control is the exact exposure we told the client to avoid. And every
          # archived page still carries the old Rank Math "follow, index" tag,
          # so it actively invites crawlers.
          rm -rf archive-old-site
          echo "removed internal planning files and the old site archive"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4